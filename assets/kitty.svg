<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <style>
    .float { animation: float 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .tail { animation: wag 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
    .eye { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
    .heart { animation: rise 3.2s ease-in infinite; opacity: 0; }
    .h2 { animation-delay: 1.1s; }
    .h3 { animation-delay: 2.2s; }
    .spark { animation: twinkle 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .s2 { animation-delay: .7s; }
    .s3 { animation-delay: 1.4s; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes wag { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(14deg); } }
    @keyframes blink { 0%,44%,50%,100% { transform: scaleY(1); } 47% { transform: scaleY(.1); } }
    @keyframes rise { 0% { opacity: 0; transform: translateY(0) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-50px) scale(1); } }
    @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
  </style>

  <!-- sparkles -->
  <g fill="#FF8FB8">
    <path class="spark" d="M30 40 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z"/>
    <path class="spark s2" d="M185 60 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5z"/>
    <path class="spark s3" d="M40 160 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z"/>
  </g>

  <!-- floating hearts -->
  <g fill="#F06595">
    <path class="heart" d="M150 70 c-4 -6 -12 -2 -10 4 c1 4 10 10 10 10 s9 -6 10 -10 c2 -6 -6 -10 -10 -4z"/>
    <path class="heart h2" d="M165 85 c-3 -4 -9 -1 -7.5 3 c.8 3 7.5 7.5 7.5 7.5 s6.7 -4.5 7.5 -7.5 c1.5 -4 -4.5 -7 -7.5 -3z"/>
    <path class="heart h3" d="M140 90 c-3 -4 -9 -1 -7.5 3 c.8 3 7.5 7.5 7.5 7.5 s6.7 -4.5 7.5 -7.5 c1.5 -4 -4.5 -7 -7.5 -3z"/>
  </g>

  <g class="float">
    <!-- tail -->
    <path class="tail" d="M150 175 q35 -5 30 -45 q-2 -12 -10 -8 q6 30 -22 40z" fill="#FFC1DA" stroke="#E75480" stroke-width="3" stroke-linejoin="round"/>
    <!-- body -->
    <ellipse cx="110" cy="165" rx="48" ry="32" fill="#FFE3EE" stroke="#E75480" stroke-width="3"/>
    <!-- paws -->
    <ellipse cx="90" cy="192" rx="12" ry="7" fill="#FFF0F6" stroke="#E75480" stroke-width="3"/>
    <ellipse cx="130" cy="192" rx="12" ry="7" fill="#FFF0F6" stroke="#E75480" stroke-width="3"/>
    <!-- ears -->
    <path d="M68 92 L62 48 L98 72z" fill="#FFE3EE" stroke="#E75480" stroke-width="3" stroke-linejoin="round"/>
    <path d="M152 92 L158 48 L122 72z" fill="#FFE3EE" stroke="#E75480" stroke-width="3" stroke-linejoin="round"/>
    <path d="M71 84 L67 58 L88 72z" fill="#FF8FB8"/>
    <path d="M149 84 L153 58 L132 72z" fill="#FF8FB8"/>
    <!-- head -->
    <ellipse cx="110" cy="105" rx="52" ry="44" fill="#FFE3EE" stroke="#E75480" stroke-width="3"/>
    <!-- bow -->
    <g transform="translate(140 66) rotate(20)">
      <path d="M0 0 L-16 -10 L-16 10z" fill="#F06595" stroke="#C2185B" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0 0 L16 -10 L16 10z" fill="#F06595" stroke="#C2185B" stroke-width="2" stroke-linejoin="round"/>
      <circle r="4.5" fill="#FF8FB8" stroke="#C2185B" stroke-width="2"/>
    </g>
    <!-- eyes -->
    <g class="eye"><ellipse cx="90" cy="104" rx="6" ry="8" fill="#5A2140"/><circle cx="92" cy="101" r="2" fill="#fff"/></g>
    <g class="eye"><ellipse cx="130" cy="104" rx="6" ry="8" fill="#5A2140"/><circle cx="132" cy="101" r="2" fill="#fff"/></g>
    <!-- cheeks -->
    <ellipse cx="78" cy="120" rx="9" ry="5" fill="#FF8FB8" opacity=".6"/>
    <ellipse cx="142" cy="120" rx="9" ry="5" fill="#FF8FB8" opacity=".6"/>
    <!-- nose + mouth -->
    <path d="M106 115 h8 l-4 5z" fill="#F06595"/>
    <path d="M110 120 q-4 6 -9 3 M110 120 q4 6 9 3" fill="none" stroke="#5A2140" stroke-width="2" stroke-linecap="round"/>
    <!-- whiskers -->
    <g stroke="#E75480" stroke-width="2" stroke-linecap="round">
      <path d="M70 112 L50 108"/><path d="M70 118 L50 120"/>
      <path d="M150 112 L170 108"/><path d="M150 118 L170 120"/>
    </g>
  </g>
</svg>
