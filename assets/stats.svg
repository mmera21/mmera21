<svg xmlns="http://www.w3.org/2000/svg" width="495" height="200" viewBox="0 0 495 200"><style>
  .t { font: 700 18px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #D6336C; }
