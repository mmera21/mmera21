<svg xmlns="http://www.w3.org/2000/svg" width="350" height="200" viewBox="0 0 350 200"><style>
  .t { font: 700 18px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #D6336C; }
  .l { font: 400 14px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #862E5C; }
  .v { font: 700 14px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #862E5C; }
  .s { font: 400 11px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #A9497A; }
  .big { font: 700 34px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #D6336C; }
  .row { animation: in .6s ease-out both; }
  .tw { animation: tw 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  @keyframes tw { 0%,100% { opacity: .3; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.1); } }
</style>
