name: 🌸 Update GitHub stats

on:
  schedule:
    - cron: "17 9 * * *" # once a day
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    paths:
      - ".github/scripts/stats.mjs"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate pink stats cards
        run: node .github/scripts/stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Save cards to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/activity.svg
          git diff --staged --quiet || git commit -m "🌸 Update stats cards"
          git push
